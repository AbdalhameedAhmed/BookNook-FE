<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Buy, swap, or pick up free used books from readers in Fayoum, Egypt." />
    <meta name="theme-color" content="#F9F9FF" />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong colours.
      // Keep in sync with src/theme.tsx.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('rfoof-theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#10141E' : '#F9F9FF';
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='8' width='6' height='20' rx='1' fill='%2312797B'/%3E%3Crect x='13' y='4' width='7' height='24' rx='1' fill='%232B4A9A'/%3E%3Crect x='22' y='10' width='5' height='18' rx='1' fill='%23C9921F'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Literata:opsz,wght@7..72,400..700&family=Plus+Jakarta+Sans:wght@400..700&family=Readex+Pro:wght@300..700&display=swap" />
    <title>Rfoof: used books in Fayoum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
